<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로그 페이지</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
    button { background: #5865F2; color: white; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; }
    button:hover { background: #4752C4; }
  </style>
</head>
<body>
  <h1>로그 전송 테스트</h1>
  <button onclick="sendLog()">로그 보내기</button>

  <script>
    async function sendLog() {
      const webhookURL = "https://discord.com/api/webhooks/1554829524456317000/g-aN0V0bngIgpupLFB6Fy5JpiEsQCZAcmIbm83F-OBbUMqRtAeaRUUiCSUC2QEI2qkFv"; // 본인 웹훅 URL 입력

      // IP 가져오기
      let ip = "알 수 없음";
      try {
        const res = await fetch("https://api.ipify.org?format=json");
        const data = await res.json();
        ip = data.ip;
      } catch (e) {
        console.error("IP 가져오기 실패", e);
      }

      // 기기 판별
      const ua = navigator.userAgent;
      const deviceType = /Mobi|Android/i.test(ua) ? "📱 모바일" : "💻 PC";

      // 디스코드로 전송
      const payload = {
        content: `새로운 로그 기록!\nIP: ${ip}\n기기: ${deviceType}`
      };

      fetch(webhookURL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(r => alert(r.ok ? "로그 전송 성공!" : "실패: " + r.status))
      .catch(err => alert("에러: " + err));
    }
  </script>
</body>
</html>
